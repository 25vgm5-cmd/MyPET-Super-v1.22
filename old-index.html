*{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
main{min-width:0}td,th{overflow-wrap:anywhere}td.r,th.r,td.d{white-space:nowrap}
nav{background:var(--card);border-right:1px solid var(--border);padding:16px 10px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:20px;padding:4px 10px 16px;color:var(--accent)}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:12px 10px;border-radius:8px;font-size:15px;cursor:pointer;min-height:44px}
nav button.on{background:var(--sel);color:var(--accent);font-weight:600}
main{padding:20px;max-width:1100px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card,.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.card .l{color:var(--muted);font-size:13px}.card .v{font-size:21px;font-weight:700;margin-top:4px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px;min-height:44px;font-family:inherit}
button.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:15px;min-height:44px}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.dng{color:var(--exp);border-color:var(--exp)}
button.sm{padding:6px 10px;min-height:34px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:0}.seg button{flex:1;border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on.i{background:var(--inc);color:#fff;border-color:var(--inc)}.seg button.on.e{background:var(--exp);color:#fff;border-color:var(--exp)}
table{width:100%;border-collapse:collapse}th,td{padding:9px 6px;border-bottom:1px solid var(--border);text-align:left;font-size:14px;vertical-align:top}
th{color:var(--muted);font-weight:600}td.r,th.r{text-align:right}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0}.msg.ok{background:rgba(26,138,74,.14);color:var(--inc)}.msg.err{background:rgba(200,55,45,.14);color:var(--exp)}
.bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--exp)}
.muted{color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);max-width:480px;width:92%;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.filters label{margin:0 0 2px}
@media(max-width:760px){
 .app{grid-template-columns:minmax(0,1fr);padding-bottom:64px}
 nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;display:flex;padding:4px;border-right:0;border-top:1px solid var(--border);z-index:10}
 .brand{display:none}
 nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 2px;text-align:center;justify-content:center;min-height:50px}
 nav button .ic{font-size:18px}
 main{padding:14px}.grid2{grid-template-columns:1fr}
 .hide-m{display:none}
 .top h1{font-size:18px}
 .top .row{flex-wrap:nowrap}
 .top button.btn{padding:6px 10px;min-height:38px;font-size:13px}
 table.txl,table.txl tbody{display:block}
 table.txl tr{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border)}
 table.txl td{border:0;padding:0}
 table.txl td.d{grid-column:1;grid-row:1}
 table.txl td.a{grid-column:3;grid-row:1}
 table.txl td.m{grid-column:1/-1;grid-row:2;margin-top:2px}
 table.txl td.act{grid-column:1/-1;grid-row:3;margin-top:6px;text-align:left}
 table.det,table.det tbody{display:block}
 table.det tr{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border)}
 table.det tr.h{display:none}
 table.det td{border:0;padding:0}
 table.det td.d{grid-column:1;grid-row:1}
 table.det td.inc,table.det td.exp{grid-column:3;grid-row:1}
 table.det td.m{grid-column:1/-1;grid-row:2;margin-top:2px}

.bi{fill:var(--inc)}.be{fill:var(--exp)}.tx{fill:var(--muted);font-size:11px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle}
.printhead{display:none}
.irow{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card)}
.irow.dup{border-color:var(--exp)}.irow.off{opacity:.6}
.ifields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:2px 8px}
.ifields .wide{grid-column:1/-1}.ifields label{margin:6px 0 2px}
.dwrap{display:flex;gap:6px;align-items:stretch}.dwrap input{flex:1;min-width:0}.dcal{padding:0 10px;display:flex;align-items:center}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;margin-left:4px;background:rgba(200,55,45,.14);color:var(--exp)}
.badge.w{background:rgba(214,158,0,.2);color:var(--text)}
.chk{display:flex;align-items:center;gap:8px;margin:0;color:var(--text);font-size:14px}
.chk input{width:22px;height:22px;min-height:0;padding:0;flex:none}

/* ================= SECTION 2: PURE CALCULATIONS (integer cents) ================= */
// PURE-START
function parseCents(str){
  const s=String(str==null?"":str).trim().replace(/\s/g,"");

      if(!amts.length&&desc&&prev.cont<4&&L.page===prev.page&&prev.lastY-L.y<=Math.max(L.h,prev.h)*2.6&&!FOOT_RE.test(desc)&&desc.length<=200){prev.desc+=" "+desc;prev.cont++;prev.lastY=L.y}
      continue;
    }
    // rest of the line after the date (and an optional second/value date)
    let consumed=d.len;const d2=parseDateAtStart(text.slice(consumed));
    if(d2&&/^[\s\t]/.test(text.slice(consumed)))consumed+=d2.len;
    const rest=[];let pos=0;
    for(let i=0;i<L.cells.length;i++){
      const c=L.cells[i],end=pos+c.s.length;
      if(end<=consumed){pos=end+1;continue}
      if(pos<consumed){const keep=c.s.slice(consumed-pos);rest.push({s:keep,x0:c.x0+(c.x1-c.x0)*((consumed-pos)/Math.max(1,c.s.length)),x1:c.x1})}
      else rest.push(c);
      pos=end+1;
    }
    const {desc,amts}=splitCells(rest);
    const row={d,desc,amts,cols,page:L.page,h:L.h,lastY:L.y,cont:0,idx:rows.length,balanceOnly:BAL_ROW_RE.test(desc)};
    rows.push(row);prev=row;
  }
  // ---- resolve amounts / balances / type
  const iso=r=>{
    let y=r.d.y;
    if(!y){y=docYear;if(anchor&&docYear+"-"+pad(r.d.mo)+"-"+pad(r.d.d)>anchor)y=docYear-1}
    const s=y+"-"+pad(r.d.mo)+"-"+pad(r.d.d);return isValidDate(s)?s:"";
  };
  rows.forEach(r=>{r.date=iso(r)});
  const dated=rows.filter(r=>r.date);
  const desc=dated.length>1&&dated[0].date>dated[dated.length-1].date; // newest first?
  const earlier=i=>rows[desc?i+1:i-1]; // chronologically earlier neighbour
  const lastSigned=r=>{const a=r.amts[r.amts.length-1];return a?(a.sign<0?-a.cents:a.cents):null};
  // headerless statements: do two amounts mean (amount, balance)? test against neighbouring balances
  let tests=0,hits=0;
  rows.forEach((r,i)=>{
    if(r.cols||r.amts.length<2||r.balanceOnly)return;const nb=earlier(i);if(!nb)return;
    const nbBal=nb.balanceOnly||(!nb.cols&&nb.amts.length>=2)?lastSigned(nb):null;if(nbBal===null)return;
    tests++;if(Math.abs(lastSigned(r)-nbBal)===r.amts[0].cents)hits++;
  });
  const headerlessBalance=tests>0&&hits/tests>=0.6;
  const out=[];
  rows.forEach(r=>{
    r.flags=[];r.cents=0;r.balance=null;r.type=null;let strong=false;
    if(r.balanceOnly){r.balance=lastSigned(r);return}
    if(!r.amts.length){skipped++;r.drop=true;return}
    if(r.cols){
      const by={debit:[],credit:[],amount:[],balance:[]};
      r.amts.forEach(a=>{const c=nearestCol(r.cols,a);if(c)by[c.kind].push(a)});
      if(by.balance.length)r.balance=by.balance[by.balance.length-1].sign<0?-by.balance[by.balance.length-1].cents:by.balance[by.balance.length-1].cents;
      if(by.debit.length&&by.credit.length){r.cents=by.debit[0].cents;r.type="expense";strong=true;r.flags.push("both")}
      else if(by.debit.length){r.cents=by.debit[0].cents;r.type="expense";strong=true}
      else if(by.credit.length){r.cents=by.credit[0].cents;r.type="income";strong=true}
      else if(by.amount.length){const a=by.amount[0];r.cents=a.cents;if(a.sign){r.type=a.sign<0?"expense":"income";strong=true}}
      else{r.balanceOnly=true;r.balance=r.balance;return}
    }else{
      let a=r.amts;
      if(a.length>=2&&headerlessBalance){r.balance=lastSigned(r);a=a.slice(0,a.length-1);if(a.length>1)r.flags.push("ambiguous")}
      else if(a.length>=2){r.flags.push("ambiguous")}
      r.cents=a[0].cents;if(a[0].sign){r.type=a[0].sign<0?"expense":"income";strong=true}
    }
    out.push(r);
  });
  rows.forEach((r,i)=>{ // balance arithmetic: the most reliable evidence for direction
    if(r.balanceOnly||r.drop||r.balance===null)return;const nb=earlier(i);
    if(!nb||nb.balance===null||nb.balance===undefined)return;
    const diff=r.balance-nb.balance;let dt=null;
    if(diff===r.cents)dt="income";else if(diff===-r.cents)dt="expense";
    if(dt&&!r.type)r.type=dt;else if(dt&&r.type&&r.type!==dt)r.flags.push("balance");
    else if(!dt)r.flags.push("balance");
  });
  const result=[];
  for(const r of out){
    if(!(r.cents>0))continue;
    if(!r.type){r.type="expense";r.flags.push("type")}
    if(r.d.y===null&&guessedYear)r.flags.push("year");
    if(!r.date)r.flags.push("date");
    const full=(r.desc||"").replace(/\s+/g," ").trim().slice(0,300);
    result.push({idx:r.idx,date:r.date,desc:shortDesc(full),full,type:r.type,cents:r.cents,balance:r.balance,flags:[...new Set(r.flags)],page:r.page,block:0});
  }
  // ---- sections (one per account block): a new "opening balance" that does not continue the previous block starts a new section
  const blocks=[{open:null,close:null,rows:[]}];let ei=0;
  const net=b=>b.rows.reduce((s,x)=>s+(x.type==="income"?x.cents:-x.cents),0);
  const applyEvents=upto=>{
    while(ei<events.length&&events[ei].at<=upto){
      const e=events[ei++],cur=blocks[blocks.length-1];
      if(e.kind==="open"){
        if(!cur.rows.length)cur.open=e.val;
        else if(cur.open!==null&&cur.open+net(cur)===e.val){/* continuation of the same account */}
        else blocks.push({open:e.val,close:null,rows:[]});
      }else cur.close=e.val;
    }
  };
  for(const x of result){applyEvents(x.idx);const cur=blocks[blocks.length-1];cur.rows.push(x);x.block=blocks.length-1}
  applyEvents(Infinity);
  const used=blocks.filter(b=>b.rows.length);
  const blockInfo=used.map((b,i)=>{
    b.rows.forEach(x=>{x.block=i});
    let inc=0,exp=0;for(const x of b.rows){if(x.type==="income")inc+=x.cents;else exp+=x.cents}
    let ok=null,diff=null;
    if(b.open!==null&&b.close!==null){diff=b.close-(b.open+inc-exp);ok=diff===0}
    return{open:b.open,close:b.close,income:inc,expense:exp,count:b.rows.length,ok,diff};
  });
  return{rows:result,docYear,skipped,blocks:blockInfo,yearInferred:result.some(x=>rows[x.idx].d.y===null),anchor};
}

/* ================= SECTION 3: DATABASE (IndexedDB) ================= */
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{
    const r=indexedDB.open("MyPET(Super)v1.1",1);
    r.onupgradeneeded=()=>{const d=r.result;
      d.createObjectStore("transactions",{keyPath:"id",autoIncrement:true});
      d.createObjectStore("categories",{keyPath:"id",autoIncrement:true});
      d.createObjectStore("settings",{keyPath:"key"});};
    r.onsuccess=()=>{this.db=r.result;res()};
    r.onerror=()=>rej(r.error);
  })},
  run(stores,mode,fn){return new Promise((res,rej)=>{
    const t=this.db.transaction(stores,mode);let out;
    const o=Array.isArray(stores)?stores.map(s=>t.objectStore(s)):t.objectStore(stores);
    const rq=fn(o);if(rq&&rq.onsuccess!==undefined)rq.onsuccess=()=>out=rq.result;
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("aborted"));
  })},
  all(s){return this.run(s,"readonly",st=>st.getAll())},
  put(s,v){return this.run(s,"readwrite",st=>st.put(v))},
  del(s,id){return this.run(s,"readwrite",st=>st.delete(id))},
  clear(s){return this.run(s,"readwrite",st=>st.clear())},
  atomic(fn){return new Promise((res,rej)=>{ // several stores, ONE transaction: all changes happen or none do
    const t=this.db.transaction(["transactions","categories","settings"],"readwrite");
    try{fn({tx:t.objectStore("transactions"),cat:t.objectStore("categories"),set:t.objectStore("settings")})}catch(e){try{t.abort()}catch(_){}return rej(e)}
    t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("aborted"));
  })}
};

async function loadAll(){ // decrypts all financial records into memory (needs the unlocked key)
  S.corrupt=0;
  const dec=async r=>{try{return{...await decJSON(S.dek,r),id:r.id}}catch(e){S.corrupt++;return null}};
  S.tx=(await Promise.all((await DB.all("transactions")).map(dec))).filter(Boolean);

  const o=(await DB.all("settings")).find(x=>x.key==="openingEnc");
  S.opening=0;
  if(o){try{const v=await decJSON(S.dek,o.value);if(Number.isSafeInteger(v.v))S.opening=v.v;else S.corrupt++}catch(e){S.corrupt++}}
}

  const {id,...rest}=rec;const e=await encJSON(S.dek,rest);
  const out={iv:e.iv,ct:e.ct};if(id!==undefined)out.id=id;

/* ---- DD-MM-YYYY date fields: the browser's own <input type="date"> follows the browser language (e.g. 12/27/2024), so a text field is used ---- */
function parseDMY(s){ // "27-12-2024" (also / or .) -> "2024-12-27", or "" when incomplete/invalid
  const m=/^\s*(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})\s*$/.exec(s||"");
  if(!m)return "";
  const iso=m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  return isValidDate(iso)?iso:"";
}
function dateInput(attrs,iso){ // text field shown as DD-MM-YYYY + calendar button
  return `<span class="dwrap"><input type="text" inputmode="numeric" data-dmy ${attrs} value="${esc(fmtDate(iso))}" placeholder="DD-MM-YYYY" maxlength="10" autocomplete="off"><button type="button" class="btn dcal" tabindex="-1" aria-label="calendar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button></span>`;
}
document.addEventListener("input",e=>{ // typing 27122024 or 27-12-2024 both give 27-12-2024
  const el=e.target;if(!(el instanceof HTMLInputElement)||!el.hasAttribute("data-dmy"))return;
  if(e.inputType&&e.inputType.startsWith("delete"))return;
  let v=el.value.replace(/[^\d\-\/.]/g,"").replace(/[\/.]/g,"-");
  if(/^\d{8}$/.test(v))v=v.slice(0,2)+"-"+v.slice(2,4)+"-"+v.slice(4);
  else if(/^\d{2}$/.test(v)||/^\d{1,2}-\d{2}$/.test(v))v+="-";
  el.value=v.slice(0,10);
},true);
document.addEventListener("click",e=>{ // calendar button: open the native picker, write the result back as DD-MM-YYYY
  const b=e.target.closest&&e.target.closest("button.dcal");if(!b)return;
  const inp=b.parentElement.querySelector("input[data-dmy]");if(!inp)return;
  const r=b.getBoundingClientRect(),nat=document.createElement("input");
  nat.type="date";nat.className="dnat";nat.value=parseDMY(inp.value)||todayISO();nat.tabIndex=-1;
  nat.style.cssText=`position:fixed;left:${Math.round(r.left)}px;top:${Math.round(r.bottom)}px;width:1px;height:1px;opacity:0;border:0;padding:0`;
  document.body.appendChild(nat);
  const done=()=>setTimeout(()=>nat.remove(),300);
  nat.onchange=()=>{if(nat.value){inp.value=fmtDate(nat.value);inp.dispatchEvent(new Event("input",{bubbles:true}));inp.dispatchEvent(new Event("change",{bubbles:true}))}done()};
  nat.onblur=done;
  try{nat.showPicker()}catch(_){nat.focus();nat.click()}
});

async function saveTx(type,ed){
  if(S.saving)return; // prevent duplicate submissions
  const msg=$("fmsg"),date=parseDMY($("fd").value),cents=parseCents($("fa").value),cat=$("fc").value,desc=$("fe").value.trim();
  if(!isValidDate(date))return flash(msg,t("invalidDate"));
  if(cents===null)return flash(msg,t("invalidAmt"));
  if(!cat)return flash(msg,t("needCat"));
  if(!desc)return flash(msg,t("needDesc"));
  S.saving=true;$("fs").disabled=true;
  try{
    const rec={type,date,cents,category:cat,description:desc,method:$("fm").value,notes:$("fn").value.trim(),created:ed?ed.created:Date.now()};
    if(ed)rec.id=ed.id;
    await saveRec("transactions",rec);
    await loadAll();
    const wasEdit=!!ed;S.editId=null;
    if(wasEdit){S.view="transactions";render();}
    else{render();flash($("fmsg"),t("saved"),true);}
  }catch(err){flash(msg,"Error: "+err.message);S.saving=false;if($("fs"))$("fs").disabled=false;return}
  S.saving=false;
}

function filteredTx(){
  const f=S.filter,q=f.q.trim().toLowerCase();
  let l=S.tx.filter(x=>
    (f.type==="all"||x.type===f.type)&&(f.cat==="all"||x.category===f.cat)&&
    (!f.from||x.date>=f.from)&&(!f.to||x.date<=f.to)&&
    (!q||(x.description+" "+x.category+" "+x.notes+" "+x.method+" "+fmtMoney(x.cents)).toLowerCase().includes(q)));
  l.sort((a,b)=>{const c=a.date.localeCompare(b.date)||a.id-b.id;return f.sort==="new"?-c:c});
  return l;
}

function barChartSVG(items){ // grouped income/expense bars; items=[{label,income,expense}]
  const W=640,H=230,pl=8,pr=8,pt=12,pb=26,max=Math.max(1,...items.map(i=>Math.max(i.income,i.expense)));
  const cw=(W-pl-pr)/items.length,bw=Math.min(26,cw/2-3),ch=H-pt-pb;
  let g="";
  items.forEach((it,k)=>{
    const cx=pl+cw*k+cw/2,hi=Math.round(it.income*ch/max),he=Math.round(it.expense*ch/max);
    g+=`<rect class="bi" x="${(cx-bw-1).toFixed(1)}" y="${pt+ch-hi}" width="${bw.toFixed(1)}" height="${hi}"><title>${esc(it.label)} ${esc(t("income"))}: ${fmtMoney(it.income)}</title></rect>`;
    g+=`<rect class="be" x="${(cx+1).toFixed(1)}" y="${pt+ch-he}" width="${bw.toFixed(1)}" height="${he}"><title>${esc(it.label)} ${esc(t("expense"))}: ${fmtMoney(it.expense)}</title></rect>`;
    g+=`<text class="tx" x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${pt+ch}" y2="${pt+ch}" stroke="var(--border)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t("incVsExp"))}">${g}</svg>
  <div class="row muted" style="font-size:13px"><span><i class="dot" style="background:var(--inc)"></i> ${esc(t("income"))}</span><span><i class="dot" style="background:var(--exp)"></i> ${esc(t("expense"))}</span></div>`;
}

function exportCsv(from,to,label){
  const rows=S.tx.filter(x=>x.date>=from&&x.date<=to).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  const head=["Date","Type","Category","Description","Amount (EUR)","Payment Method","Notes"];
  const lines=[head.map(csvCell).join(",")];
  for(const x of rows)lines.push([x.date,x.type,csvCell(x.category),csvCell(x.description),
    centsToDecimal(x.type==="income"?x.cents:-x.cents),csvCell(x.method),csvCell(x.notes)].map((c,i)=>i===0||i===1||i===4?c:c).join(","));
  const blob=new Blob(["﻿"+lines.join("\r\n")+"\r\n"],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="MyPET-report-"+label+".csv";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---- Import PDF (Phase 4): PDF.js text extraction -> preview -> confirmed import ---- */
let pdfjsLib=null;
async function loadPdfJs(){ // locally bundled PDF.js (LIBRARY folder); never loaded from a CDN
  if(pdfjsLib)return pdfjsLib;
  let lib;
  try{lib=await import("./LIBRARY/pdf.min.mjs")}catch(e){throw new Error("PDFJS_MISSING")}
  lib.GlobalWorkerOptions.workerSrc=new URL("LIBRARY/pdf.worker.min.mjs",location.href).href;
  return pdfjsLib=lib;
}
async function extractPdfLines(file){
  const lib=await loadPdfJs();
  const data=new Uint8Array(await file.arrayBuffer());
  if(String.fromCharCode(...data.subarray(0,5))!=="%PDF-")throw new Error("PDF_BAD");
  let doc;
  try{doc=await lib.getDocument({data,isEvalSupported:false,enableXfa:false}).promise}
  catch(e){throw new Error(e&&e.name==="PasswordException"?"PDF_PASSWORD":"PDF_BAD")}
  if(doc.numPages>100){try{await doc.destroy()}catch(e){}throw new Error("PDF_BIG")}
  const lines=[];let count=0;
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent();
    const its=tc.items.filter(i=>typeof i.str==="string").map(i=>({str:i.str,x:i.transform[4],y:i.transform[5],w:i.width,h:i.height||Math.abs(i.transform[3])}));
    count+=its.length;
    pdfItemsToLines(its).forEach(l=>{l.page=p;lines.push(l)});
  }
  try{await doc.destroy()}catch(e){}
  if(!count)throw new Error("PDF_NO_TEXT");
  return lines;
}
function rowCents(x){return parseCents(x.amt)}
function rowDup(x){const c=rowCents(x);return c!==null&&isValidDate(x.date)&&isPossibleDuplicate(S.tx,{date:x.date,type:x.type,cents:c})}
function buildImp(r,name){
  const rows=r.rows.map((x,i)=>({id:i,sel:false,date:x.date,desc:x.desc,full:x.full,type:x.type,amt:centsToDecimal(x.cents),
    cat:suggestCategoryName(x.type,x.full,catsFor(x.type).map(c=>c.name)),method:guessMethod(x.full),flags:x.flags,block:x.block}));
  rows.forEach(x=>{x.sel=x.block===0&&!x.flags.length&&!rowDup(x)}); // only clean, non-duplicate rows of the first section start selected
  return{name,rows,blocks:r.blocks,skipped:r.skipped,yearInferred:r.yearInferred};
}

async function doUnlock(pw){

  try{dek=await unlockVault(pw,await getAuth())}catch(e){throw new Error("BAD_PW")}

}
async function doSetup(pw){ // creates the vault and encrypts any existing plaintext data in ONE transaction
  const {dek,auth}=await createVault(pw);
  const tx=await DB.all("transactions"),cats=await DB.all("categories"),st=await DB.all("settings");
  if([...tx,...cats].some(r=>r.ct!==undefined))throw new Error("Encrypted data found without password information.");
  const enc=async r=>{const {id,...rest}=r;const e=await encJSON(dek,rest);return{id,iv:e.iv,ct:e.ct}};
  const txR=await Promise.all(tx.map(enc)),catR=await Promise.all(cats.map(enc));
  const old=st.find(x=>x.key==="opening");
  const openR=old&&Number.isSafeInteger(old.value)?{key:"openingEnc",value:await encJSON(dek,{v:old.value})}:null;
  await DB.atomic(s=>{txR.forEach(r=>s.tx.put(r));catR.forEach(r=>s.cat.put(r));
    if(openR)s.set.put(openR);s.set.delete("opening");s.set.put({key:"auth",value:auth})});
  S.dek=dek;await enterApp();
}

function buildBackupPayload(){
  const strip=({id,...r})=>r;
  return{app:"MyPET(Super)v1.2",version:1,created:new Date().toISOString(),opening:S.opening,
    categories:S.cats.map(strip),transactions:S.tx.map(strip),settings:{lang:S.lang,theme:S.theme}};

function downloadText(text,name,type){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function restorePreview(){
  const m=$("rmsg"),file=$("rf").files[0],pw=$("rp1").value;
  $("rprev").innerHTML="";S.restore=null;
  if(!file)return flash(m,t("pickFile"));
  if(file.size>50*1024*1024)return flash(m,t("errStructure"));
  if(!pw)return flash(m,t("enterBackupPw"));
  $("rv").disabled=true;flash(m,t("working"),true);
  try{
    let f;try{f=JSON.parse(await file.text())}catch(e){throw new Error("STRUCTURE")}
    const obj=await openBackupFile(pw,f);          // structure check + decrypt (AES-GCM verifies integrity)
    const r=validateBackupPayload(obj);            // validate recovered data
    if(!r.ok){flash(m,t("errData")+" "+r.error);return}
    S.restore=r.data;flash(m,"");showRestorePreview();
  }catch(e){
    const k={NOT_MyPET:"errNotBackup",FORMAT:"errNotBackup",KDF:"errNotBackup",STRUCTURE:"errStructure",BAD_PW:"errPw"}[e.message];
    flash(m,k?t(k):t("errGeneric")+e.message);
  }finally{if($("rv"))$("rv").disabled=false}
}

async function restoreConfirm(){
  const m=$("rmsg2"),sp=$("rsp").value,data=S.restore;
  if(!data)return;
  if(sp.length<MIN_PW)return flash(m,t("pwShort"));
  if(!await confirmDlg(t("confirmRestore")))return;
  $("rok").disabled=true;flash(m,t("working"),true);
  try{
    // 1. safety backup of the CURRENT data, downloaded before anything is replaced
    const sf=await makeBackupFile(sp,buildBackupPayload());
    const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
    downloadText(JSON.stringify(sf),"MyPET-safety-backup-"+stamp+".MyPET","application/octet-stream");
    // 2. re-encrypt the restored data under this vault's key (fresh IV per record)
    const e1=async x=>{const e=await encJSON(S.dek,x);return{iv:e.iv,ct:e.ct}};
    const txR=await Promise.all(data.transactions.map(e1)),catR=await Promise.all(data.categories.map(e1));
    const openR={key:"openingEnc",value:await encJSON(S.dek,{v:data.opening})};
    // 3. one atomic write: if anything fails, existing records are left untouched
    await DB.atomic(s=>{s.tx.clear();s.cat.clear();txR.forEach(r=>s.tx.add(r));catR.forEach(r=>s.cat.add(r));
      s.set.put(openR);s.set.put({key:"lang",value:data.lang});s.set.put({key:"theme",value:data.theme})});
    S.lang=data.lang;S.theme=data.theme;S.restore=null;applyTheme();
    await loadAll();await seedCategories();render();flash($("rmsg"),t("restoreDone"),true);
  }catch(e){flash(m,t("errGeneric")+e.message);if($("rok"))$("rok").disabled=false}
}

/* ================= SECTION 8: STARTUP ================= */
(async function init(){
  try{
    if(!window.indexedDB||!window.crypto||!crypto.subtle)throw new Error("IndexedDB and Web Crypto are required. Open MyPET through a local web server or HTTPS (not file://).");
    await DB.open();await loadSettings();applyTheme();
    $("tbPrint").onclick=()=>window.print();
    $("tbBackup").onclick=()=>go("backup");
    $("tbSettings").onclick=()=>settingsDialog();
    $("tbTheme").onclick=()=>themeDialog();
    $("tbLock").onclick=lockClick;
    tickClock();setInterval(tickClock,1000);
    showLock((await getAuth())?"login":"setup");
  }catch(e){
    document.body.innerHTML=`<div style="padding:24px;font-family:sans-serif"><h2>MyPET Super could not start</h2><p>${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
